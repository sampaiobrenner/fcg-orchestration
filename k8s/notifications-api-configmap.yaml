apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-api-config
  labels:
    app: notifications-api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Database__ApplyMigrationsOnStartup: "true"
  RabbitMq__Host: "rabbitmq"
  RabbitMq__VirtualHost: "/"
  Jwt__Issuer: "fcg-users-api"
  Jwt__Audience: "fcg"
  Messaging__Queues__NotificationsUserCreated: "notifications.user-created"
  Messaging__Queues__NotificationsPaymentProcessed: "notifications.payment-processed"
