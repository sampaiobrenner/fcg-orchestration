# Valores de desenvolvimento para cluster local (kind/minikube). Nao reutilize em ambientes reais.
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  labels:
    app: users-api
type: Opaque
stringData:
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=fcg_users;Username=fcg;Password=fcg"
  RabbitMq__Username: "fcg"
  RabbitMq__Password: "fcg"
  Jwt__Key: "fcg-dev-only-signing-key-change-me-0123456789"
