name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker-compose valido
        run: docker compose config --no-interpolate -q

      - name: Manifests Kubernetes validos
        run: docker run --rm -v "$PWD/k8s:/k8s" ghcr.io/yannh/kubeconform:latest -strict -summary /k8s

      - name: Workflows do GitHub Actions validos
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Analise SonarCloud (manifests Kubernetes, compose e workflows)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.projectKey=sampaiobrenner_fcg-orchestration
            -Dsonar.organization=sampaiobrenner
            -Dsonar.host.url=https://sonarcloud.io

      - name: Sonar nao configurado
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN ausente; analise ignorada."

